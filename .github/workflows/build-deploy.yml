name: Build and Deploy CV

# Триггера workflow_run здесь больше нет. Он запускал сборку CV в контексте
# базового репозитория — с секретами и записывающим токеном — по факту
# завершения другого workflow, и это классический способ получить исполнение
# чужого кода с правами прода. Плюс он потерял смысл: контейнер ниже запиннен
# по digest, так что пересборка образа сама по себе ничего в CV не меняет.
# Новый образ подхватывается коммитом, который меняет digest в этом файле —
# такой коммит и так попадает под push-триггер.
on:
  push:
    branches: [main, master]
    paths-ignore: [Dockerfile, texlive.profile, .dockerignore]
  # Резюме тоже надо смотреть глазами до выкатки, а не после. На pull request
  # собирается тот же сайт и уезжает отдельной версией воркера — со своим
  # адресом и не трогая продакшен. Те же пути пропускаем: правка Dockerfile
  # сама по себе резюме не меняет, образ пинится по digest.
  pull_request:
    paths-ignore: [Dockerfile, texlive.profile, .dockerignore]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

# Пусто на уровне workflow — каждая job запрашивает права явно и минимально.
# Сборке хватает contents: read, а токен Cloudflare живёт только в деплое,
# который ничего не собирает: сборка исполняет код из репозитория и внешние
# бинарники texlive, и доступ к воркерам ей не нужен.
permissions: {}

concurrency:
  # Не отменяем на лету: прерванный деплой оставит воркер в промежуточном
  # состоянии, а сборка PDF занимает минуты — очередь дешевле поломки.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Ветку из форка не собираем: секретов ей не дают, и это правильно, но без
    # них сборка не сможет ни забрать образ из GHCR, ни получить данные
    # резюме — она свалилась бы на первом шаге, а выглядело бы это как поломка
    # пайплайна. Dependabot исключён отдельно: его PR выглядят внутренними, а
    # секреты он получает из своего хранилища, не из Actions.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    permissions:
      contents: read # checkout
      packages: read # pull образа из GHCR
    container:
      # Пин по digest, а не по :latest: тег в реестре подвижен, и подменённый
      # образ выполнял бы произвольный код с секретами этой job.
      # Обновление: пересобрать образ через docker-image.yml и подставить сюда
      # digest, который тот workflow печатает в summary.
      image: ghcr.io/cosmdandy/cv-texlive@sha256:976d5bd24c62f6067466f2e05978713fa7545567b338ba646276ae7f5698f2b8 # :latest на 2026-08-04, с pypdf
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CV_LANG_EN: ${{ vars.CV_LANG_EN || 'true' }}
      CV_LANG_RU: ${{ vars.CV_LANG_RU || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # checkout по умолчанию оставляет токен в .git/config, откуда его
          # прочитает любой следующий шаг. Git-операций после клона тут нет.
          persist-credentials: false

      - name: Determine enabled languages
        id: langs
        run: |
          LANGS=""
          if [ "$CV_LANG_EN" = "true" ]; then LANGS="en"; fi
          if [ "$CV_LANG_RU" = "true" ]; then LANGS="${LANGS:+$LANGS,}ru"; fi
          if [ -z "$LANGS" ]; then echo "::error::At least one language must be enabled"; exit 1; fi
          echo "list=$LANGS" >> "$GITHUB_OUTPUT"
          echo "Enabled languages: $LANGS"

      # Дальше везде значения приходят через env, а не подстановкой ${{ }} в
      # тело скрипта: подстановка склеивается в текст скрипта до запуска shell,
      # поэтому кавычка или `$(...)` внутри значения станет кодом.
      - name: Inject CV data
        env:
          CV_DATA: ${{ secrets.CV_DATA }}
        run: |
          if [ -z "$CV_DATA" ]; then
            echo "::warning::CV_DATA secret is empty, using example data"
            cp cv-data.example.yaml cv-data.yaml
          else
            printf '%s' "$CV_DATA" | base64 -d > cv-data.yaml
          fi

      - name: Validate CV data
        run: python3 -c "import yaml; d=yaml.safe_load(open('cv-data.yaml')); assert d, 'cv-data.yaml is empty'; print('OK:', len(d), 'top-level keys')"

      - name: Generate LaTeX
        env:
          LANGS: ${{ steps.langs.outputs.list }}
        run: |
          python3 scripts/build.py --data cv-data.yaml --lang "$LANGS" --output output/
          python3 scripts/build.py --data cv-data.yaml --lang "$LANGS" --output output/ --template ats

      - name: Compile LaTeX to PDF
        env:
          LANGS: ${{ steps.langs.outputs.list }}
        working-directory: output
        run: |
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            latexmk -xelatex -interaction=nonstopmode "CV-Timofey-Kondrashin-${lang}.tex"
            latexmk -xelatex -interaction=nonstopmode "CV-Timofey-Kondrashin-ats-${lang}.tex"
          done

      - name: Convert PDF to WebP
        env:
          LANGS: ${{ steps.langs.outputs.list }}
        working-directory: output
        run: |
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            pdftoppm -r 300 -png "CV-Timofey-Kondrashin-${lang}.pdf" "page-${lang}"
            for f in page-${lang}-*.png; do
              page_num=$(echo "$f" | grep -o '[0-9]*\.png' | grep -o '[0-9]*')
              cwebp -q 92 "$f" -o "cv-${lang}-${page_num}.webp"
              cwebp -q 88 -resize 1240 0 "$f" -o "cv-${lang}-${page_num}-sm.webp"
              rm "$f"
            done
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-pdfs
          path: output/CV-Timofey-Kondrashin-*.pdf
          retention-days: 7

      # CNAME сюда больше не копируется: он нужен был GitHub Pages, а на
      # Cloudflare домен привязан к воркеру в дашборде.
      - name: Prepare site content
        env:
          LANGS: ${{ steps.langs.outputs.list }}
        run: |
          mkdir -p _site/fonts
          for lang in $(echo "$LANGS" | tr ',' ' '); do
            cp "output/CV-Timofey-Kondrashin-${lang}.pdf" _site/
          done
          cp output/cv-*.webp _site/
          python3 scripts/build_pages.py --langs "$LANGS" --input pages/index.html --output _site/index.html --pdf-dir output
          cp pages/fonts/*.woff2 _site/fonts/
          find pages -maxdepth 1 -type f ! -name 'index.html' -exec cp {} _site/ \;

      # Обычный артефакт вместо upload-pages-artifact: тот пакует в формат,
      # который умеет разворачивать только deploy-pages.
      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: _site/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://cv.cosmdandy.dev
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Нужен только wrangler.jsonc, история не требуется.
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: _site/

      # На продакшене отметки нет — этим он и отличается от стендов. Но просто
      # не ставить её нельзя: в закоммиченной странице лежит штамп локальной
      # сборки, и без стирания на продакшен уехало бы «локально».
      - name: Clear build stamp
        run: python3 scripts/stamp_build.py _site/index.html _site/404.html --clear

      # Секреты нельзя проверить в if: — контекст secrets там недоступен.
      # Без этого шага отсутствие токена выглядит как невнятная ошибка внутри
      # wrangler, и непонятно, сломался деплой или не настроен доступ.
      - name: Проверка доступа к Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Не задано: $missing. Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  preview:
    name: preview
    needs: build
    # Только для PR из этого же репозитория — по той же причине, что и у
    # сборки: форку секретов не дают, и загружать версию воркера ему нечем.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Адрес превью пишется комментарием в сам PR. Иначе его пришлось бы
      # выкапывать из summary прогона, а смотреть на него идут из обсуждения.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Нужен только wrangler.jsonc, история не требуется.
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: _site/

      # Отметка о сборке ставится здесь, а не в сборке: артефакт один на оба
      # стенда, и «где развёрнуто» знает только тот, кто развёртывает.
      - name: Stamp build
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/stamp_build.py _site/index.html _site/404.html \
            --env cloudflare --sha "$SHA" --ref "$REF" --pr "$PR"

      # versions upload, а не deploy: загружается новая версия воркера со своим
      # адресом, а продакшен продолжает отдавать текущую.
      - id: upload
        name: Upload version to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          # grep без совпадения возвращает единицу, и присваивание уронило бы
          # шаг: bash здесь запущен с -e.
          url=$(printf '%s' "$OUTPUT" \
            | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1 || true)
          if [ -z "$url" ]; then
            url="адрес не найден в выводе wrangler"
          fi
          {
            echo "### Превью этой версии"
            echo
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
          # Через printf, а не многострочной строкой в кавычках: внутри
          # YAML-блока вторая строка сохранила бы отступ, а для markdown это
          # уже блок кода.
          body=$(printf \
            'Превью: %s\n\nСобрано из `%s`. Продакшен отдаёт текущую версию.' \
            "$url" "$SHA")
          # Правим свой прошлый комментарий, а не плодим новый на каждый push:
          # в обсуждении должен остаться один адрес — сегодняшний.
          gh pr comment "$PR" --body "$body" --edit-last \
            || gh pr comment "$PR" --body "$body"
