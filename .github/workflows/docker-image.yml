name: Build Docker Image

on:
  push:
    branches: [main, master]
    paths: [Dockerfile]
  workflow_dispatch:

# Пусто на уровне workflow — job запрашивает права явно и минимально.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push образа в GHCR
      id-token: write # OIDC-токен для подписи провенанса
      attestations: write # публикация attestation репозитория
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout по умолчанию оставляет токен в .git/config. Он попал бы в
          # build context и осел в слоях образа. Git после клона тут не нужен.
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/cosmdandy/cv-texlive:latest

      # Подписанный провенанс на собранный digest. build-deploy.yml пинит образ
      # по digest, и attestation даёт проверить, что этот digest собран здесь:
      #   gh attestation verify oci://ghcr.io/cosmdandy/cv-texlive:latest --owner CosmDandy
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/cosmdandy/cv-texlive
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # build-deploy.yml тянет образ по digest, а не по :latest. Печатаем digest
      # сюда, чтобы после пересборки его было откуда скопировать в пин.
      - name: Digest для пина в build-deploy.yml
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Образ собран"
            echo
            echo '```'
            echo "ghcr.io/cosmdandy/cv-texlive@${DIGEST}"
            echo '```'
            echo
            echo "Подставь этот digest в \`.github/workflows/build-deploy.yml\` (jobs.build.container.image)."
          } >> "$GITHUB_STEP_SUMMARY"
