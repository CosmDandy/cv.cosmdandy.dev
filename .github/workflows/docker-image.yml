name: Build Docker Image

on:
  push:
    branches: [main, master]
    paths: [Dockerfile]
  workflow_dispatch:

# Пусто на уровне workflow — job запрашивает права явно и минимально.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push образа в GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout по умолчанию оставляет токен в .git/config. Он попал бы в
          # build context и осел в слоях образа. Git после клона тут не нужен.
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/cosmdandy/cv-texlive:latest

      # build-deploy.yml тянет образ по digest, а не по :latest. Печатаем digest
      # сюда, чтобы после пересборки его было откуда скопировать в пин.
      - name: Digest для пина в build-deploy.yml
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Образ собран"
            echo
            echo '```'
            echo "ghcr.io/cosmdandy/cv-texlive@${DIGEST}"
            echo '```'
            echo
            echo "Подставь этот digest в \`.github/workflows/build-deploy.yml\` (jobs.build.container.image)."
          } >> "$GITHUB_STEP_SUMMARY"
