<!DOCTYPE html>
<!--
    Hi. CV typeset in LaTeX, glued by Jinja2 + GitHub Actions.
    Source: github.com/CosmDandy/cv.cosmdandy.dev
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Светлая тема выключена. Не удалена: палитра, ручной выбор и слежение
        // за системой на месте и работают — погашена только сама возможность
        // выбрать, и возвращается она одним true вот здесь. Заодно придётся
        // вернуть две метки ниже, они помечены.
        //
        // Почему выключена: тема гасится на обоих сайтах разом, чтобы визитка и
        // резюме не разъезжались, — разбор в index.html визитки.
        var THEME_CHOICE = false;

        // До отрисовки, иначе мелькнёт не та тема. Пустое хранилище означает
        // «следуй за системой».
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            // Атрибут ставится всегда, и этого довольно, чтобы светлые правила
            // не сработали: `:root[data-theme="light"]` не совпадёт, а системное
            // написано на `:root:not([data-theme])`.
            document.documentElement.setAttribute('data-theme',
                THEME_CHOICE ? (saved || system) : 'dark');
            if (!THEME_CHOICE) document.documentElement.classList.add('theme-locked');
        })();
    </script>
    <title>404 · CV · Timofey Kondrashin</title>
    <meta name="description" content="Page not found">
    <!-- Пока светлая выключена, полоса браузера тоже держится тёмной: её
         выбирает система, а не наша тема. Светлые значения возвращаются
         вместе с темой:
             <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
             <meta name="color-scheme" content="dark light"> -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <!-- Отметка о сборке: какой стенд, из чего собран и когда развёрнут.
         Значение ставит тот пайплайн, который развёртывает (tools/stamp_build.py),
         локально — sync.sh. Здесь стоит то, что видно, если не ставил никто. -->
    <meta name="build" content="env=local">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Inter';
            font-weight: 400;
            font-display: block;
            src: url('fonts/Inter-Regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-weight: 600;
            font-display: block;
            src: url('fonts/Inter-SemiBold.woff2') format('woff2');
        }

        /* Те же переменные, что на главной: тёмная по умолчанию, светлая —
           Solarized Light по системной теме. */
        :root,
        :root[data-theme="dark"] {
            --theme-fade: 0.45s cubic-bezier(0.32, 0.72, 0, 1);
            --bg: #000;
            --fg: #ededed;
            --fg-muted: #93a1a1;
            --fg-dim: #586e75;
            --ghost: rgba(237, 237, 237, 0.035);
            --ghost-mobile: rgba(237, 237, 237, 0.16);
            --line: rgba(147, 161, 161, 0.10);
            --line-hover: rgba(147, 161, 161, 0.20);
            --dots: rgba(147, 161, 161, 0.25);
            --cursor-glow-1: rgba(237, 237, 237, 0.035);
            --cursor-glow-2: rgba(237, 237, 237, 0.012);
            --inv-surface: rgba(238, 232, 213, 0.94);
            --inv-line:    rgba(88, 110, 117, 0.22);
            --inv-node:    #657b83;
            --inv-ray:     rgba(88, 110, 117, 0.38);
            --inv-shadow:  0 6px 24px -6px rgba(0, 0, 0, 0.85);
        }

        :root[data-theme="light"] {
            --bg: #fdf6e3;
            --fg: #073642;
            --fg-muted: #586e75;
            --fg-dim: #93a1a1;
            --ghost: rgba(7, 54, 66, 0.06);
            --ghost-mobile: rgba(7, 54, 66, 0.14);
            --line: rgba(88, 110, 117, 0.16);
            --line-hover: rgba(88, 110, 117, 0.26);
            --dots: rgba(88, 110, 117, 0.18);
            --cursor-glow-1: rgba(7, 54, 66, 0.05);
            --cursor-glow-2: rgba(7, 54, 66, 0.018);
            --inv-surface: rgba(7, 54, 66, 0.94);
            --inv-line:    rgba(147, 161, 161, 0.22);
            --inv-node:    #93a1a1;
            --inv-ray:     rgba(147, 161, 161, 0.40);
            --inv-shadow:  0 6px 24px -6px rgba(88, 110, 117, 0.35);
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme]) {
                --bg: #fdf6e3;
                --fg: #073642;
                --fg-muted: #586e75;
                --fg-dim: #93a1a1;
                --ghost: rgba(7, 54, 66, 0.06);
                --ghost-mobile: rgba(7, 54, 66, 0.14);
                --line: rgba(88, 110, 117, 0.16);
                --line-hover: rgba(88, 110, 117, 0.26);
                --dots: rgba(88, 110, 117, 0.18);
                --cursor-glow-1: rgba(7, 54, 66, 0.05);
                --cursor-glow-2: rgba(7, 54, 66, 0.018);
                --inv-surface: rgba(7, 54, 66, 0.94);
                --inv-line:    rgba(147, 161, 161, 0.22);
                --inv-node:    #93a1a1;
                --inv-ray:     rgba(147, 161, 161, 0.40);
                --inv-shadow:  0 6px 24px -6px rgba(88, 110, 117, 0.35);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-variant-numeric: tabular-nums;
            background: var(--bg);
            color: var(--fg-muted);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .dot-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--dots) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    var(--cursor-glow-1) 0%,
                    var(--cursor-glow-2) 35%,
                    transparent 60%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s;
            opacity: 0;
        }

        .cursor-glow.visible { opacity: 1; }

        .not-found-bg {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10rem, 32vw, 26rem);
            font-weight: 600;
            color: var(--ghost);
            letter-spacing: -0.06em;
            line-height: 1;
            text-align: center;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: fadeUp 1s cubic-bezier(0.32, 0.72, 0, 1) backwards;
        }

        main {
            position: relative;
            z-index: 2;
            padding: 24px;
        }

        .not-found-message {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.78rem;
            color: var(--fg-muted);
            margin-bottom: 32px;
            letter-spacing: 0.01em;
            line-height: 1.55;
            transform: translateZ(0);
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 80ms backwards;
        }

        a.cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--fg-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 12px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            transform: translateZ(0);
            transition:
                color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 160ms backwards;
        }

        a.cta:hover {
            color: var(--fg);
            border-color: var(--line-hover);
            transform: translate3d(0, -1px, 0);
        }

        .footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.72rem;
            letter-spacing: 0.02em;
            color: var(--fg-dim);
            z-index: 3;
            pointer-events: none;
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 240ms backwards;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .footer a:hover { color: var(--fg-muted); }
        .footer .sep { opacity: 0.5; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 8px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @media (max-width: 480px) {
            .footer { bottom: 16px; font-size: 0.7rem; }
            .cursor-glow { display: none; }
            .not-found-bg {
                align-items: flex-start;
                padding-top: 15vh;
                color: var(--ghost-mobile);
                letter-spacing: -0.02em;
                transform: translateZ(0) scaleY(1.5);
                transform-origin: top center;
                -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
                mask-image: linear-gradient(to top, black 60%, transparent 100%);
            }
        }

        /* Переключатель темы — как на остальных страницах, но в углу:
           панели управления тут нет. Два состояния, солнце и луна. */
        /* Пока светлая тема выключена (THEME_CHOICE в скрипте страницы), кнопки
           нет: переключатель, который ничего не переключает, хуже
           отсутствующего. Класс ставит тот же скрипт. */
        :root.theme-locked .theme-switch { display: none; }

        /* ── Отметка о сборке ───────────────────────────────────────────────────────
           Какой стенд, из чего собран и когда развёрнут. Стоит в углу и приглушена:
           это инструмент для того, кто правит сайт, а не часть страницы. Под курсором
           проявляется — читать её всё-таки иногда надо.

           На продакшене её не рисуют вовсе (см. скрипт в странице), поэтому правил
           «спрятать» здесь нет: нечего прятать. */
        .build-badge {
            position: fixed;
            left: 14px;
            bottom: 12px;
            z-index: 5;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 0.68rem;
            letter-spacing: 0.02em;
            color: var(--meta);
            opacity: 0.5;
            transition: opacity 0.25s ease;
        }
        .build-badge:hover { opacity: 1; }
        .build-badge a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }
        .build-badge a:hover { color: var(--heading); }

        .theme-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 4;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 14px;
            border: 1px solid var(--inv-line);
            background: var(--inv-surface);
            box-shadow: var(--inv-shadow);
            cursor: pointer;
            transition:
                background   var(--theme-fade),
                border-color var(--theme-fade),
                transform    0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-switch:hover { transform: translate3d(0, -1px, 0); }

        .theme-switch svg {
            grid-area: 1 / 1;
            width: 22px;
            height: 22px;
            display: block;
            color: var(--inv-node);
            transition:
                opacity   0.35s ease,
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                color     var(--theme-fade);
        }

        .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        .icon-moon { opacity: 0; transform: rotate(90deg)  scale(0.5); }

        :root[data-theme="light"] .icon-sun,
        :root:not([data-theme]) .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }

        :root[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        :root[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
            :root:not([data-theme]) .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        :root.theme-animating,
        :root.theme-animating *,
        :root.theme-animating *::before,
        :root.theme-animating *::after {
            transition:
                background-color var(--theme-fade),
                color            var(--theme-fade),
                border-color     var(--theme-fade),
                box-shadow       var(--theme-fade),
                fill             var(--theme-fade),
                stroke           var(--theme-fade) !important;
        }

        @media (max-width: 480px) {
            .theme-switch { top: 16px; right: 16px; width: 38px; height: 38px; }
        }

    </style>
</head>
<body>
    <button class="theme-switch" id="theme-switch" type="button"
            aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 4.9 4.9M19.1 19.1l-1.6-1.6M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7Z"/>
        </svg>
    </button>

    <div class="dot-bg"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="not-found-bg">404</div>

    <main>
        <p class="not-found-message">We can't reach this part of the network right now.</p>
        <a href="/" class="cta">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Head home or stay a while
        </a>
    </main>

    <footer class="footer">
        <span>error 404</span>
        <span class="sep">·</span>
        <a href="/">head home</a>
        <span class="sep">·</span>
        <span>not found</span>
    </footer>

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const dotsEl = document.querySelector('.dot-bg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
        });

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();
    </script>
    <script>
        // Два состояния в интерфейсе, три по смыслу: пока выбора нет, идём за
        // системой и реагируем на её смену на лету.
        (function () {
            var btn = document.getElementById('theme-switch');
            var systemLight = window.matchMedia('(prefers-color-scheme: light)');
            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function saved() {
                try {
                    var v = localStorage.getItem('theme');
                    return v === 'light' || v === 'dark' ? v : null;
                } catch (e) { return null; }
            }

            function label(theme) {
                var text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                            : 'Светлая тема, включить тёмную';
                btn.setAttribute('aria-label', text);
                btn.setAttribute('title', text);
            }

            function setTheme(theme, animate) {
                var root = document.documentElement;
                if (animate && !reduced) {
                    root.classList.add('theme-animating');
                    window.setTimeout(function () { root.classList.remove('theme-animating'); }, 500);
                }
                root.setAttribute('data-theme', theme);
                label(theme);
            }

            // Пока светлая выключена, слушать некого и незачем: и кнопка, и
            // смена системной темы вели бы страницу туда, где её нет. Код
            // остаётся рабочим — включается вместе с THEME_CHOICE.
            if (THEME_CHOICE) {
                btn.addEventListener('click', function () {
                    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    try { localStorage.setItem('theme', next); } catch (e) {}
                    setTheme(next, true);
                });

                systemLight.addEventListener('change', function (e) {
                    if (!saved()) setTheme(e.matches ? 'light' : 'dark', true);
                });
            }

            label(document.documentElement.getAttribute('data-theme') || 'dark');
        })();
    </script>
    <script>
        // Отметка о сборке. Три стенда с виду неотличимы, и это регулярно
        // сбивало: правка проверена — но на каком именно стенде? Строку в углу
        // собираем из метки в шапке; кто её туда положил — дело пайплайна,
        // здесь она только читается.
        (function () {
            var raw = (document.querySelector('meta[name="build"]') || {}).content || '';
            var b = {};
            raw.split(';').forEach(function (p) {
                var i = p.indexOf('=');
                if (i > 0) b[p.slice(0, i)] = p.slice(i + 1);
            });
            // Продакшен тем и отличается, что на нём отметки нет: там её стирает
            // пайплайн выкатки. Пустая метка — нечего и рисовать.
            var where = { local: 'локально', cloudflare: 'cloudflare' }[b.env];
            if (!where) return;
            var head = [where];
            if (b.ref && b.ref !== '—') head.push(b.ref);
            if (b.pr) head.push('PR #' + b.pr);

            var el = document.createElement('div');
            el.className = 'build-badge';
            el.appendChild(document.createTextNode(head.join(' · ')));

            // Хэш ведёт на pull request, если он есть, и на коммит, если нет:
            // от «вижу поломку» до «вижу диф» одно нажатие. Плюс в конце хэша
            // значит несохранённое в дереве — на коммит с ним не сошлёшься.
            if (b.sha) {
                // Разделитель здесь, а не в конце шапки: без штампа хэша нет
                // вовсе, и точка повисала бы в воздухе — «локально · ».
                el.appendChild(document.createTextNode(' · '));
                var a = document.createElement('a');
                a.textContent = b.sha;
                a.href = 'https://github.com/' + (b.repo || 'CosmDandy/cv.cosmdandy.dev')
                    + (b.pr ? '/pull/' + b.pr : '/commit/' + b.sha.replace('+', ''));
                a.target = '_blank';
                a.rel = 'noopener';
                el.appendChild(a);
            }

            // Дату разворачиваем в часовом поясе смотрящего: она отвечает на
            // «насколько это свежее», а этот вопрос всегда про своё время.
            if (b.at) {
                var d = new Date(b.at);
                if (!isNaN(d)) {
                    var p2 = function (n) { return String(n).padStart(2, '0'); };
                    el.appendChild(document.createTextNode(' · '
                        + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear()
                        + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())));
                }
            }
            document.body.appendChild(el);
        })();
    </script>
</body>
</html>
