<!DOCTYPE html>
<!--
    Hi. CV typeset in LaTeX, glued by Jinja2 + GitHub Actions.
    Source: github.com/CosmDandy/cv.cosmdandy.dev
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // До отрисовки, иначе на долю секунды мелькнёт не та тема.
        (function () {
            var t = 'auto';
            try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
            if (['auto', 'light', 'dark'].indexOf(t) === -1) t = 'auto';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>404 — CV | Timofey Kondrashin</title>
    <meta name="description" content="Page not found">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" href="fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Inter';
            font-weight: 400;
            font-display: block;
            src: url('fonts/Inter-Regular.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-weight: 600;
            font-display: block;
            src: url('fonts/Inter-SemiBold.woff2') format('woff2');
        }

        /* Те же переменные, что на главной: тёмная по умолчанию, светлая —
           Solarized Light по системной теме. */
        :root,
        :root[data-theme="dark"] {
            --bg: #000;
            --fg: #ededed;
            --fg-muted: #93a1a1;
            --fg-dim: #586e75;
            --ghost: rgba(237, 237, 237, 0.035);
            --ghost-mobile: rgba(237, 237, 237, 0.16);
            --line: rgba(147, 161, 161, 0.10);
            --line-hover: rgba(147, 161, 161, 0.20);
            --dots: rgba(147, 161, 161, 0.25);
            --cursor-glow-1: rgba(237, 237, 237, 0.035);
            --cursor-glow-2: rgba(237, 237, 237, 0.012);
            --inv-surface: rgba(238, 232, 213, 0.94);
            --inv-line:    rgba(88, 110, 117, 0.22);
            --inv-node:    #657b83;
            --inv-ray:     rgba(88, 110, 117, 0.38);
            --inv-shadow:  0 6px 24px -6px rgba(0, 0, 0, 0.85);
        }

        :root[data-theme="light"] {
            --bg: #fdf6e3;
            --fg: #073642;
            --fg-muted: #586e75;
            --fg-dim: #93a1a1;
            --ghost: rgba(7, 54, 66, 0.06);
            --ghost-mobile: rgba(7, 54, 66, 0.14);
            --line: rgba(88, 110, 117, 0.16);
            --line-hover: rgba(88, 110, 117, 0.26);
            --dots: rgba(88, 110, 117, 0.18);
            --cursor-glow-1: rgba(7, 54, 66, 0.05);
            --cursor-glow-2: rgba(7, 54, 66, 0.018);
            --inv-surface: rgba(7, 54, 66, 0.94);
            --inv-line:    rgba(147, 161, 161, 0.22);
            --inv-node:    #93a1a1;
            --inv-ray:     rgba(147, 161, 161, 0.40);
            --inv-shadow:  0 6px 24px -6px rgba(88, 110, 117, 0.35);
        }

        @media (prefers-color-scheme: light) {
            :root[data-theme="auto"] {
                --bg: #fdf6e3;
                --fg: #073642;
                --fg-muted: #586e75;
                --fg-dim: #93a1a1;
                --ghost: rgba(7, 54, 66, 0.06);
                --ghost-mobile: rgba(7, 54, 66, 0.14);
                --line: rgba(88, 110, 117, 0.16);
                --line-hover: rgba(88, 110, 117, 0.26);
                --dots: rgba(88, 110, 117, 0.18);
                --cursor-glow-1: rgba(7, 54, 66, 0.05);
                --cursor-glow-2: rgba(7, 54, 66, 0.018);
                --inv-surface: rgba(7, 54, 66, 0.94);
                --inv-line:    rgba(147, 161, 161, 0.22);
                --inv-node:    #93a1a1;
                --inv-ray:     rgba(147, 161, 161, 0.40);
                --inv-shadow:  0 6px 24px -6px rgba(88, 110, 117, 0.35);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-variant-numeric: tabular-nums;
            background: var(--bg);
            color: var(--fg-muted);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        .dot-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--dots) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    var(--cursor-glow-1) 0%,
                    var(--cursor-glow-2) 35%,
                    transparent 60%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s;
            opacity: 0;
        }

        .cursor-glow.visible { opacity: 1; }

        .not-found-bg {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10rem, 32vw, 26rem);
            font-weight: 600;
            color: var(--ghost);
            letter-spacing: -0.06em;
            line-height: 1;
            text-align: center;
            pointer-events: none;
            user-select: none;
            z-index: 1;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            animation: fadeUp 1s cubic-bezier(0.32, 0.72, 0, 1) backwards;
        }

        main {
            position: relative;
            z-index: 2;
            padding: 24px;
        }

        .not-found-message {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.78rem;
            color: var(--fg-muted);
            margin-bottom: 32px;
            letter-spacing: 0.01em;
            line-height: 1.55;
            transform: translateZ(0);
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 80ms backwards;
        }

        a.cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--fg-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 12px 18px;
            border: 1px solid var(--line);
            border-radius: 12px;
            transform: translateZ(0);
            transition:
                color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 160ms backwards;
        }

        a.cta:hover {
            color: var(--fg);
            border-color: var(--line-hover);
            transform: translate3d(0, -1px, 0);
        }

        .footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.72rem;
            letter-spacing: 0.02em;
            color: var(--fg-dim);
            z-index: 3;
            pointer-events: none;
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 240ms backwards;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
            pointer-events: auto;
            transition: color 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .footer a:hover { color: var(--fg-muted); }
        .footer .sep { opacity: 0.5; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 8px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @media (max-width: 480px) {
            .footer { bottom: 16px; font-size: 0.7rem; }
            .cursor-glow { display: none; }
            .not-found-bg {
                align-items: flex-start;
                padding-top: 15vh;
                color: var(--ghost-mobile);
                letter-spacing: -0.02em;
                transform: translateZ(0) scaleY(1.5);
                transform-origin: top center;
                -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
                mask-image: linear-gradient(to top, black 60%, transparent 100%);
            }
        }

        /* Переключатель темы — как на остальных страницах, но в углу:
           панели управления тут нет. */
        .theme-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 4;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 14px;
            border: 1px solid var(--inv-line);
            background: var(--inv-surface);
            box-shadow: var(--inv-shadow);
            cursor: pointer;
            transition:
                background   0.5s ease,
                border-color 0.5s ease,
                transform    0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-switch:hover { transform: translate3d(0, -1px, 0); }
        .theme-switch svg { width: 24px; height: 24px; display: block; }
        .theme-switch .ray { stroke: var(--inv-ray); transition: stroke 0.5s ease; }
        .theme-switch .node { fill: var(--inv-node); transition: fill 0.5s ease; }

        .theme-switch .star {
            transform-origin: 12px 12px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        :root[data-theme="auto"]  .theme-switch .star { transform: rotate(0deg);   opacity: 0.4; }
        :root[data-theme="light"] .theme-switch .star { transform: rotate(120deg); opacity: 1; }
        :root[data-theme="dark"]  .theme-switch .star { transform: rotate(240deg); opacity: 1; }

        @media (max-width: 480px) {
            .theme-switch { top: 16px; right: 16px; width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <button class="theme-switch" id="theme-switch" type="button"
            aria-label="Тема: по системе" title="Тема: по системе">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <defs>
                <linearGradient id="themeStarGrad" x1="22%" y1="100%" x2="78%" y2="0%">
                    <stop offset="0%" stop-color="#ee5c80"/><stop offset="25%" stop-color="#ee76a8"/>
                    <stop offset="50%" stop-color="#9452cd"/><stop offset="75%" stop-color="#34cdeb"/>
                    <stop offset="100%" stop-color="#32eeeb"/>
                </linearGradient>
            </defs>
            <g class="ray" stroke-width="0.9" fill="none">
                <line x1="12" y1="12" x2="12" y2="4"/><line x1="12" y1="12" x2="18.9" y2="8"/>
                <line x1="12" y1="12" x2="18.9" y2="16"/><line x1="12" y1="12" x2="12" y2="20"/>
                <line x1="12" y1="12" x2="5.1" y2="16"/><line x1="12" y1="12" x2="5.1" y2="8"/>
            </g>
            <g class="node">
                <circle cx="12" cy="4" r="1.25"/><circle cx="18.9" cy="8" r="1.25"/>
                <circle cx="18.9" cy="16" r="1.25"/><circle cx="12" cy="20" r="1.25"/>
                <circle cx="5.1" cy="16" r="1.25"/><circle cx="5.1" cy="8" r="1.25"/>
            </g>
            <path class="star" fill="url(#themeStarGrad)"
                  d="M12 6.6 C12.45 10.15 13.85 11.55 17.4 12 C13.85 12.45 12.45 13.85 12 17.4 C11.55 13.85 10.15 12.45 6.6 12 C10.15 11.55 11.45 10.15 12 6.6 Z"/>
        </svg>
    </button>

    <div class="dot-bg"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="not-found-bg">404</div>

    <main>
        <p class="not-found-message">We can't reach this part of the network right now.</p>
        <a href="/" class="cta">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Head home or stay a while
        </a>
    </main>

    <footer class="footer">
        <span>error 404</span>
        <span class="sep">·</span>
        <a href="/">head home</a>
        <span class="sep">·</span>
        <span>not found</span>
    </footer>

    <script>
        const cursorGlow = document.getElementById('cursor-glow');
        const dotsEl = document.querySelector('.dot-bg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX, cursorY = mouseY;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorGlow.classList.add('visible');
        });

        document.addEventListener('mouseleave', () => {
            cursorGlow.classList.remove('visible');
        });

        (function animate() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;
            cursorGlow.style.left = cursorX + 'px';
            cursorGlow.style.top = cursorY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animate);
        })();
    </script>
    <script>
        // Переключатель темы: auto → light → dark по кругу.
        (function () {
            var THEMES = ['auto', 'light', 'dark'];
            var LABELS = { auto: 'по системе', light: 'светлая', dark: 'тёмная' };
            var btn = document.getElementById('theme-switch');

            function label(theme) {
                var text = 'Тема: ' + LABELS[theme];
                btn.setAttribute('aria-label', text);
                btn.setAttribute('title', text);
            }

            btn.addEventListener('click', function () {
                var now = document.documentElement.getAttribute('data-theme') || 'auto';
                var next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
                label(next);
            });

            label(document.documentElement.getAttribute('data-theme') || 'auto');
        })();
    </script>
</body>
</html>
