    <script>
        // Светлая тема выключена. Не удалена: палитра, ручной выбор и слежение
        // за системой на месте и работают — погашена только сама возможность
        // выбрать, и возвращается она одним true вот здесь. Заодно придётся
        // вернуть две метки ниже, они помечены.
        //
        // Почему выключена: тема гасится на обоих сайтах разом, чтобы визитка и
        // резюме не разъезжались, — разбор в index.html визитки.
        var THEME_CHOICE = false;

        // До отрисовки, иначе на долю секунды мелькнёт не та тема.
        // Пустое хранилище означает «следуй за системой», поэтому пишем сюда
        // только то, что пользователь выбрал руками.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            if (saved !== 'light' && saved !== 'dark') saved = null;
            var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            // Атрибут ставится всегда, и этого довольно, чтобы светлые правила
            // не сработали: `:root[data-theme="light"]` не совпадёт, а системное
            // написано на `:root:not([data-theme])`.
            document.documentElement.setAttribute('data-theme',
                THEME_CHOICE ? (saved || system) : 'dark');
            if (!THEME_CHOICE) document.documentElement.classList.add('theme-locked');
        })();

        // Пришли переездом с визитки. Занавес поднят с самого первого кадра:
        // страница собирается за ним и выходит уже готовой. Ставить его
        // отсюда обязательно — узел в теле появился бы позже первой отрисовки,
        // а псевдоэлемент корня существует ровно с этой строки.
        //
        // Заодно прячем строку до того, как её посчитают: скрипт переезда
        // стоит ниже, у самой шапки, и браузер успевает отрисовать кадр
        // раньше.
        if (/[?&]vt=/.test(location.search)) {
            document.documentElement.classList.add('vt-pending', 'vt-veil', 'vt-shut');
        }
    </script>
    <!-- Разделитель везде один — точка на средней линии (·). Полоски («|», «—»)
         в карточке мессенджера читаются как обрыв строки, точка — как пауза.
         «CV» капсом: это аббревиатура Curriculum Vitae, строчными она стала бы
         похожа на опечатку. Ник cosmdandy из заголовка и описания убран — он
         остаётся в alternateName и og:image:alt. -->
    <title>CV · Timofey Kondrashin</title>
    <meta name="description"
        content="Curriculum Vitae of Timofey Kondrashin · DevOps Engineer with experience in Kubernetes, Terraform, CI/CD, and cloud infrastructure. EN/RU PDF.">
    <!-- Пока светлая выключена, полоса браузера тоже держится тёмной: её

         вместе с темой:
             <meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
             <meta name="color-scheme" content="dark light"> -->
    <meta name="theme-color" content="#000000">

    <style>
        /* swap, а не block: block прячет текст до приезда шрифта, и на медленном
           мобильном соединении это ровно те сотни миллисекунд, когда экран уже
           свёрстан, но пуст. Шрифты в preload, так что подмена держится недолго. */
        @font-face {
            font-family: 'Inter';
            font-weight: 400;
            font-display: swap;
            src: url('fonts/Inter-Regular.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Inter';
            font-weight: 600;
            font-display: swap;
            src: url('fonts/Inter-SemiBold.woff2') format('woff2');
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 8px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate3d(0, 6px, 0) scale(0.96); }
            to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        @keyframes badgeShimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Цвета вынесены в переменные, чтобы светлая тема переопределяла их
           одним блоком ниже. По умолчанию — тёмная: она была тут всегда, и у
           тех, кто не выставил системную тему, страница остаётся прежней.

           Светлая — Solarized Light, та же гамма, что у cosmdandy.dev и блога.
           Свечение под превью в обеих темах одинаковое. */
        :root,
        :root[data-theme="dark"] {
            /* Длительность перекраски при смене темы — одна на весь файл,
               иначе фон, текст и рамки приезжают вразнобой. */
            --theme-fade: 0.45s cubic-bezier(0.32, 0.72, 0, 1);

            --fg: #ededed;
            --fg-muted: #839496;
            --fg-dim: #586e75;

            --bg: #000;
            --dots: rgba(147, 161, 161, 0.25);

            --surface-from:  rgba(255, 255, 255, 0.05);
            --surface-to:    rgba(255, 255, 255, 0.02);
            --surface-soft:  rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --surface-active: rgba(255, 255, 255, 0.08);

            --line:     rgba(255, 255, 255, 0.08);
            --line-top: rgba(255, 255, 255, 0.14);
            --img-line:     rgba(255, 255, 255, 0.10);
            --img-line-top: rgba(255, 255, 255, 0.20);
            --img-glow: rgba(255, 255, 255, 0.06);

            /* Подсветка ссылки под курсором. Лист резюме белый в обеих темах,
               поэтому цвет тут один — голубой из общей палитры. */
            --link-mark: rgba(38, 139, 210, 0.16);

            /* Плашка с адресом у курсора. Плотный фон, а не стекло: она
               всплывает и над тёмным полем, и над белым листом резюме. */
            --hint-bg:   rgba(6, 22, 27, 0.92);
            --hint-line: rgba(147, 161, 161, 0.22);
            --hint-fg:   rgba(238, 232, 213, 0.92);
            --hint-dim:  rgba(147, 161, 161, 0.55);

            --cursor-glow-1: rgba(237, 237, 237, 0.035);
            --cursor-glow-2: rgba(237, 237, 237, 0.013);

            --btn-bg: var(--fg);
            --btn-fg: #000;

            --selection-fg: var(--fg);
            --focus: rgba(0, 220, 255, 0.5);

            /* Плашка переключателя контрастна фону: на тёмной теме светлая,
               на светлой тёмная — кнопка читается как отдельный предмет. */
            --inv-surface: rgba(238, 232, 213, 0.94);
            --inv-line:    rgba(88, 110, 117, 0.22);
            --inv-node:    #657b83;
            --inv-ray:     rgba(88, 110, 117, 0.38);
            --inv-shadow:  0 6px 20px -6px rgba(0, 0, 0, 0.85);
        }

        :root[data-theme="light"] {
            --fg: #073642;       /* base02 */
            --fg-muted: #657b83; /* base00 */
            --fg-dim: #93a1a1;   /* base1  */

            --bg: #fdf6e3;       /* base3  */
            --dots: rgba(88, 110, 117, 0.18);

            /* Поверхности на base2: та же логика «чуть плотнее фона», но со
               светлым основанием — иначе стекло превращается в грязь. */
            --surface-from:  rgba(238, 232, 213, 0.60);
            --surface-to:    rgba(238, 232, 213, 0.30);
            --surface-soft:  rgba(88, 110, 117, 0.05);
            --surface-hover: rgba(88, 110, 117, 0.08);
            --surface-active: rgba(88, 110, 117, 0.10);

            --line:     rgba(88, 110, 117, 0.14);
            --line-top: rgba(88, 110, 117, 0.20);
            --img-line:     rgba(88, 110, 117, 0.16);
            --img-line-top: rgba(88, 110, 117, 0.24);
            --img-glow: rgba(88, 110, 117, 0.18);

            --cursor-glow-1: rgba(7, 54, 66, 0.05);
            --cursor-glow-2: rgba(7, 54, 66, 0.018);

            --btn-bg: #073642;
            --btn-fg: #fdf6e3;

            --focus: rgba(38, 139, 210, 0.6);

            --inv-surface: rgba(7, 54, 66, 0.94);
            --inv-line:    rgba(147, 161, 161, 0.22);
            --inv-node:    #93a1a1;
            --inv-ray:     rgba(147, 161, 161, 0.40);
            --inv-shadow:  0 6px 20px -6px rgba(88, 110, 117, 0.35);
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme]) {
                --fg: #073642;       /* base02 */
                --fg-muted: #657b83; /* base00 */
                --fg-dim: #93a1a1;   /* base1  */

                --bg: #fdf6e3;       /* base3  */
                --dots: rgba(88, 110, 117, 0.18);

                /* Поверхности на base2: та же логика «чуть плотнее фона», но со
                   светлым основанием — иначе стекло превращается в грязь. */
                --surface-from:  rgba(238, 232, 213, 0.60);
                --surface-to:    rgba(238, 232, 213, 0.30);
                --surface-soft:  rgba(88, 110, 117, 0.05);
                --surface-hover: rgba(88, 110, 117, 0.08);
                --surface-active: rgba(88, 110, 117, 0.10);

                --line:     rgba(88, 110, 117, 0.14);
                --line-top: rgba(88, 110, 117, 0.20);
                --img-line:     rgba(88, 110, 117, 0.16);
                --img-line-top: rgba(88, 110, 117, 0.24);
                --img-glow: rgba(88, 110, 117, 0.18);

                --cursor-glow-1: rgba(7, 54, 66, 0.05);
                --cursor-glow-2: rgba(7, 54, 66, 0.018);

                --btn-bg: #073642;
                --btn-fg: #fdf6e3;

                --focus: rgba(38, 139, 210, 0.6);

                --inv-surface: rgba(7, 54, 66, 0.94);
                --inv-line:    rgba(147, 161, 161, 0.22);
                --inv-node:    #93a1a1;
                --inv-ray:     rgba(147, 161, 161, 0.40);
                --inv-shadow:  0 6px 20px -6px rgba(88, 110, 117, 0.35);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::selection {
            background: rgba(120, 40, 220, 0.4);
            color: var(--selection-fg);
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* Dot pattern background */
        .dot-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--dots) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 1;
        }

        .page {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 16px 32px;
            width: 100%;
            max-width: 1000px;
        }

        .header-left {
            text-decoration: none;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: opacity 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 0ms backwards;
        }

        .header-left:hover {
            opacity: 0.7;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 4px;
            color: var(--fg);
        }

        .header-left .subtitle {
            font-size: 0.9rem;
            color: var(--fg-dim);
            font-weight: 400;
        }

        .links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--fg-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .links a:hover {
            color: var(--fg);
        }

        .links a {
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .links a:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 60ms backwards; }
        .links a:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 120ms backwards; }
        .links a:nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 180ms backwards; }
        .links a:nth-child(4) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 240ms backwards; }

        /* Размер один на все четыре — но чтобы он и выглядел одним, у каждой
           иконки viewBox обрезан по самой фигуре. Иначе «поле» внутри бокса
           врёт: при формально равной ширине круг GitHub выходил мельче круга
           Telegram, а RSS торчал выше соседей. После обрезки площадь заливки
           сходится (43.6 / 43.8 / 44.8 %), и ряд ровный без исключений. */
        .links a svg {
            width: 16.5px;
            height: 16.5px;
        }

        /* Controls bar */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin: 0 16px 24px;
            background: linear-gradient(180deg, var(--surface-from) 0%, var(--surface-to) 100%);
            border: 1px solid var(--line);
            border-top: 1px solid var(--line-top);
            border-radius: 14px;
            backdrop-filter: blur(25px);
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 240ms backwards;
        }

        .controls .btn,
        .controls .zoom-btn {
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 300ms backwards;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--fg-dim);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition:
                color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }

        .btn:hover {
            color: var(--fg);
            background: var(--surface-soft);
            transform: translate3d(0, -1px, 0);
        }

        .btn.active {
            background: var(--surface-active);
            border-color: var(--line);
            color: var(--fg);
        }

        .controls-divider {
            width: 1px;
            height: 20px;
            background: var(--line);
            margin: 0 4px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--fg-dim);
            font-size: 1.1rem;
            cursor: pointer;
            transition:
                color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .zoom-btn:hover:not(:disabled) {
            color: var(--fg);
            background: var(--surface-hover);
            transform: translate3d(0, -1px, 0);
        }

        .zoom-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .zoom-label {
            font-size: 0.75rem;
            color: var(--fg-dim);
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .btn-download {
            position: relative;
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
            isolation: isolate;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 360ms backwards;
            transition:
                transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-download::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg,
                    rgba(255, 50, 100, 0)    0%,
                    rgba(255, 50, 100, 0.35) 20%,
                    rgba(120, 40, 220, 0.35) 50%,
                    rgba(0, 220, 255, 0.35)  80%,
                    rgba(0, 220, 255, 0)     100%);
            background-size: 200% 100%;
            background-position: 200% 0;
            mix-blend-mode: multiply;
            animation: badgeShimmer 4.5s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        .btn-download:hover {
            transform: translate3d(0, -1px, 0) scale(1.02);
            filter: brightness(1.05);
        }


        /* ── Переключатель темы ───────────────────────────────────────────
           Два состояния, солнце и луна. Отдельного «авто» в интерфейсе нет:
           пустой localStorage сам означает «следуй за системой», а первый
           клик записывает явный выбор.

           Живёт в панели управления: угол экрана занят ссылками шапки. */
        /* Пока светлая тема выключена (THEME_CHOICE в скрипте страницы), кнопки
           нет: переключатель, который ничего не переключает, хуже
           отсутствующего. Класс ставит тот же скрипт. Вместе с кнопкой уходит
           и её разделитель — иначе он торчит справа от «Download PDF»
           чертой, за которой ничего нет. */
        :root.theme-locked .theme-switch,
        :root.theme-locked .theme-divider { display: none; }

        /* ── Отметка о сборке ───────────────────────────────────────────────────────
           Какой стенд, из чего собран и когда развёрнут. Стоит в углу и приглушена:
           это инструмент для того, кто правит сайт, а не часть страницы. Под курсором
           проявляется — читать её всё-таки иногда надо.

           На продакшене её не рисуют вовсе (см. скрипт в странице), поэтому правил
           «спрятать» здесь нет: нечего прятать. */
        .build-badge {
            position: fixed;
            left: 14px;
            bottom: 12px;
            z-index: 5;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 0.68rem;
            letter-spacing: 0.02em;
            color: var(--meta);
            opacity: 0.5;
            transition: opacity 0.25s ease;
        }
        .build-badge:hover { opacity: 1; }
        .build-badge a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }
        .build-badge a:hover { color: var(--heading); }

        .theme-switch {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid var(--inv-line);
            background: var(--inv-surface);
            box-shadow: var(--inv-shadow);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 330ms backwards;
            transition:
                background   var(--theme-fade),
                border-color var(--theme-fade),
                box-shadow   var(--theme-fade),
                transform    0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-switch:hover { transform: translate3d(0, -1px, 0); }
        .theme-switch:active { transform: translate3d(0, 0, 0) scale(0.96); }

        /* Иконки лежат друг на друге: одна уезжает, вторая приезжает. */
        .theme-switch svg {
            grid-area: 1 / 1;
            width: 18px;
            height: 18px;
            display: block;
            color: var(--inv-node);
            transition:
                opacity   0.35s ease,
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                color     var(--theme-fade);
        }

        .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        .icon-moon { opacity: 0; transform: rotate(90deg)  scale(0.5); }

        :root[data-theme="light"] .icon-sun,
        :root:not([data-theme]) .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }

        :root[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        :root[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
            :root:not([data-theme]) .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .theme-switch { animation: none; }
        }

        /* ── Плавная смена темы ───────────────────────────────────────────
           Переходы навешиваются только на время переключения: постоянные
           перебили бы собственные анимации панели и подсветку кнопок. */
        :root.theme-animating,
        :root.theme-animating *,
        :root.theme-animating *::before,
        :root.theme-animating *::after {
            transition:
                background-color var(--theme-fade),
                background-image var(--theme-fade),
                color            var(--theme-fade),
                border-color     var(--theme-fade),
                box-shadow       var(--theme-fade),
                fill             var(--theme-fade),
                stroke           var(--theme-fade) !important;
        }

        /* PDF Viewer */
        .viewer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 48px;
        }

        #pdf-container {
            position: relative;
            max-width: 1000px;
            width: 100%;
            transition: max-width 0.18s linear;
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 420ms backwards;
        }

        /* Glow effect — sits behind PDF, follows container size */
        .glow {
            position: absolute;
            inset: -120px;
            border-radius: 60px;
            background: linear-gradient(45deg,
                    rgba(255, 50, 100, 0.45) 0%,
                    rgba(255, 80, 150, 0.30) 25%,
                    rgba(120, 40, 220, 0.15) 50%,
                    rgba(0, 220, 255, 0.30) 75%,
                    rgba(0, 255, 255, 0.45) 100%);
            filter: blur(160px);
            pointer-events: none;
            z-index: 0;
            animation: none;
        }

        /* Лист резюме. Отступ переехал сюда с картинки: слой ссылок считает
           проценты от высоты этой коробки, и лишние 16 пикселей внизу сдвинули
           бы каждую ссылку вверх. */
        .sheet {
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
        }

        #pdf-container img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            border: 1px solid var(--img-line);
            border-top: 1px solid var(--img-line-top);
            box-shadow:
                0 0 0 1px var(--surface-soft),
                0 0 80px -20px var(--img-glow);
        }

        /* ── Слой ссылок ──────────────────────────────────────────────────
           Превью — растр, и ссылки, ради которых резюме и раздают в PDF, на
           нём мертвы. Поверх картинки лежат прозрачные <a> по координатам из
           самих link-аннотаций документа; координаты в процентах, поэтому при
           зуме и на узком экране они едут вместе с листом.

           В покое слоя не видно: резюме и так набрано так, что ссылки в нём
           различимы. Подсветка появляется только под курсором — она говорит
           «сюда можно нажать», а не размечает страницу заранее. */
        .pdf-link {
            position: absolute;
            border-radius: 2px;
            -webkit-tap-highlight-color: transparent;
            transition:
                background-color 0.28s cubic-bezier(0.32, 0.72, 0, 1),
                box-shadow 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .pdf-link:hover,
        .pdf-link:focus-visible {
            background: var(--link-mark);
            box-shadow: 0 0 0 3px var(--link-mark);
        }

        /* ── Адрес под курсором ───────────────────────────────────────────
           Куда ведёт ссылка, видно до клика: браузер пишет это мелким шрифтом
           в углу окна, а здесь адрес идёт за курсором. Для слоя поверх резюме
           это не украшение, а единственный способ узнать адрес — сама ссылка
           там невидима.

           Плашка одна на обе темы и намеренно тёмная: на светлой она читается
           как отдельный предмет, ровно как кнопка переключателя. */
        .link-hint {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 20;
            padding: 7px 11px;
            border-radius: 9px;
            border: 1px solid var(--hint-line);
            background: var(--hint-bg);
            backdrop-filter: blur(6px);
            color: var(--hint-fg);
            font-family: ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 0.76rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(0, 6px, 0) scale(0.97);
            transition:
                opacity 0.22s ease,
                transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .link-hint.on {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        /* Схема глуше самого адреса: она одинаковая у всех ссылок и нужна
           только как признак «это адрес». Сам адрес — одним цветом. */
        .link-hint .lh-scheme { color: var(--hint-dim); }

        /* ── Переход на визитку ───────────────────────────────────────────
           Имя и должность на обоих сайтах набраны одним кеглем, только здесь
           стоят в углу, а на визитке — посреди карточки. Поэтому переход
           показан как переезд самой строки: страница вокруг неё гаснет, а
           встречает её уже визитка и довозит на место.

           Нативным cross-document переходом этого не сделать: он работает
           только внутри одного origin, а cv.cosmdandy.dev и cosmdandy.dev —
           разные хосты. Отсюда ручная передача координат через адрес.

           Фон у обоих сайтов один и тот же чёрный, поэтому стык между
           документами не мигает — на этом вся иллюзия и держится. */

        /* Пришли переездом: страница уже собрана, и своё появление ей играть
           не нужно — это читалось бы как «анимация во второй раз». Заглушка
           не снимается до конца жизни документа, и это важно: стоит её снять,
           браузер считает анимацию назначенной заново и честно проигрывает с
           нуля. Именно так строка «currently building…» на визитке пропадала
           в момент клика и заново выплывала посреди отъезда. */
        :root.vt-in .links,
        :root.vt-in .controls,
        /* И всё, что в панели: кнопки языков, зум, «Download PDF» и
           переключатель темы выезжают каждый со своей задержкой, и хвост
           этого выезда торчал бы из-под тающего занавеса. Мерцание кнопки
           живёт на ::before и остаётся нетронутым. */
        :root.vt-in .controls *,
        :root.vt-in .viewer,
        :root.vt-in .footer,
        :root.vt-in .header-left h1,
        :root.vt-in .header-left .subtitle {
            animation: none;
        }

        /* Уход. Гасим плавно, а не visibility: мгновенное исчезновение всего
           вокруг и было тем самым щелчком на стыке страниц. */
        :root.vt-leaving .links,
        :root.vt-leaving .controls,
        :root.vt-leaving .viewer,
        :root.vt-leaving .footer,
        :root.vt-leaving .cursor-glow,
        :root.vt-leaving .link-hint {
            /* Анимацию появления глушим, а не пережидаем. У панели и кнопки
               она идёт с задержкой в четверть секунды, и клик вскоре после
               загрузки попадал прямо в неё: анимация сильнее перехода, и
               «Download PDF» продолжал проявляться поверх гашения. */
            animation: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s cubic-bezier(0.32, 0.72, 0, 1);
        }

        :root.vt-pending .header-left h1,
        :root.vt-pending .header-left .subtitle {
            visibility: hidden;
        }

        /* ── Занавес ──────────────────────────────────────────────────────
           Смена документа — это всегда обрыв: старый кадр гаснет, новый
           появляется целиком и сразу. Никакой анимацией этот стык не
           закрыть, потому что в этот момент не выполняется ни одна из двух
           страниц. Поэтому уходящая затемняется до фона, а приходящая из
           этого же фона проявляется — обрыв приходится на кадр, где обе
           стороны выглядят одинаково.

           Псевдоэлемент корня, а не узел в теле: он существует с первой
           строки <head>, то есть раньше, чем браузер успевает что-то
           нарисовать. */
        :root.vt-veil::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            background: var(--bg);
            pointer-events: none;
            opacity: 0;
            /* Коротко нарочно: занавес нужен ровно на стык документов, а не
               как самостоятельное движение. Длиннее — и он читается как
               пауза, ради которой гость ждёт. */
            transition: opacity 0.18s cubic-bezier(0.32, 0.72, 0, 1);
        }

        :root.vt-veil.vt-shut::after {
            opacity: 1;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 32px 16px;
            color: var(--fg-dim);
            font-size: 0.8rem;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 720ms backwards;
        }

        .footer a {
            color: var(--fg-dim);
            text-decoration: none;
            transition: color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .footer a:hover {
            color: var(--fg-muted);
        }

        /* Loading — reserve space matching A4 aspect ratio */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 210 / 297;
            width: 100%;
            color: var(--fg-dim);
            font-size: 0.9rem;
        }

        /* Cursor follower — subtle white spotlight */
        .cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    var(--cursor-glow-1) 0%,
                    var(--cursor-glow-2) 35%,
                    transparent 60%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: opacity 0.40s cubic-bezier(0.32, 0.72, 0, 1);
            opacity: 0;
            will-change: transform, opacity;
        }

        .cursor-glow.visible {
            opacity: 1;
        }

        /* Mobile */
        @media (max-width: 640px) {

            html,
            body {
                overflow-x: hidden;
                max-width: 100vw;
            }

            .header {
                padding: 24px 16px 16px;
            }

            .header-left h1 {
                font-size: 1.1rem;
            }

            .header-left .subtitle {
                font-size: 0.8rem;
            }

            .links {
                gap: 12px;
            }

            .links a span {
                display: none;
            }

            .links a svg {
                width: 20.7px;
                height: 20.7px;
            }

            .links a {
                gap: 0;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .zoom-controls {
                display: none;
            }

            .controls-divider {
                display: none;
            }

            .viewer {
                padding: 0 16px 8px;
            }

            .footer {
                padding: 12px 16px;
            }

            #pdf-container {
                max-width: 100% !important;
            }

            #pdf-container img {
                border-radius: 10px;
            }

            .sheet {
                margin-bottom: 8px;
            }

            .glow {
                inset: -40px;
                filter: blur(60px);
            }

            .cursor-glow {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
            .btn-download::before { display: none; }
            .cursor-glow         { display: none; }
        }
    </style>
</head>

        <script>
        // ── Переезд имени на визитку и обратно ─────────────────────────────

        //

        (function () {

            const exit = document.querySelector('.header-left');
            const parts = [exit.querySelector('h1'), exit.querySelector('.subtitle')];

            // Переезда не будет — снимаем метку немедленно, иначе строка,
            // спрятанная в <head> до расчёта, останется невидимой навсегда.
            if (reduced) root.classList.remove('vt-pending');

            // Меряем текст, а не элемент: на визитке заголовок центрирован и
            // занимает всю ширину карточки, так что рамка блока пришлась бы
            // мимо букв.
            function textBox(el) {
                const range = document.createRange();
                range.selectNodeContents(el);
                const box = range.getBoundingClientRect();
                return [box.left, box.top, parseFloat(getComputedStyle(el).fontSize)];
            }

            // Точка отсчёта — левый верх самих букв, а не блока. Иначе масштаб
            // растягивает строку от угла контейнера, и при центрированном
            // заголовке буквы приезжают мимо на десяток пикселей.
            function place(el, from) {
                const block = el.getBoundingClientRect();
                const text = textBox(el);
                el.style.transformOrigin = (text[0] - block.left) + 'px ' + (text[1] - block.top) + 'px';
                el.style.transform = 'translate3d(' + (from[0] - text[0]) + 'px,'
                    + (from[1] - text[1]) + 'px,0) scale(' + (from[2] / text[2]) + ')';
            }

            // ── Где строка стоит на соседнем сайте ───────────────────────
            // Раньше это была формула по ширине окна, и она всё время мазала:
            // то скроллбар съест пятнадцать пикселей, то у визитки схема
            // подожмётся по высоте и шапка съедет. Промах в несколько пикселей
            // виден как рывок на стыке страниц.
            //
            // Поэтому каждая сторона просто записывает своё место в cookie, а
            // соседняя его читает. Домен у сайтов общий (cosmdandy.dev), так
            // что cookie видна обоим; на стенде оба порта — тот же localhost,
            // и это работает там же. Первый в жизни переход идёт по формуле,
            // дальше — точно, и оно само подстраивается под размер окна.
            const COOKIE_DOMAIN = location.hostname.endsWith('cosmdandy.dev')
                ? '; domain=.cosmdandy.dev' : '';

            function remember() {
                const box = textBox(parts[0]).concat(textBox(parts[1]));
                document.cookie = 'vt-cv=' + box.map(v => Math.round(v * 10) / 10).join(',')
                    + ';path=/;max-age=604800;samesite=lax' + COOKIE_DOMAIN;
            }

            function known(key) {
                const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
                if (!m) return null;
                const n = m[1].split(',').map(Number);
                return n.length === 6 && n.every(v => isFinite(v)) ? n : null;
            }

            function exitPoint(el, i) {
                const said = known('vt-card');
                if (said) return said.slice(i * 3, i * 3 + 3);
                // Запасной вариант на самый первый переход: визитка держит
                // строку по центру — под схемой на широком экране, в карточке
                // на узком.
                const text = textBox(el);
                const range = document.createRange();
                range.selectNodeContents(el);
                const w = range.getBoundingClientRect().width;
                const wide = document.documentElement.clientWidth >= 821;
                return [(document.documentElement.clientWidth - w) / 2, wide ? 85 : 177, text[2]];
            }

            // Занавес поднят из <head>; опускаем его, когда страница готова
            // показаться. Раскладка резюме считается в первом же кадре, так
            // что ждать загрузки превью незачем — картинка проявится сама, как
            // и при обычном заходе.
            function reveal() {
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        root.classList.remove('vt-shut');
                        setTimeout(function () { root.classList.remove('vt-veil'); }, 260);
                    });
                });
            }

            const params = new URLSearchParams(location.search);
            if (params.get(KEY) && !reduced) {
                // Прилетели переездом. Двигать здесь нечего: визитка метила в
                // место, которое мы сами ей и назвали через cookie, — строка
                // уже дома. Всё, что нужно, — не дать ей проиграть своё обычное
                // появление, иначе это читается как «анимация во второй раз».
                root.classList.add('vt-in');
                exit.style.animation = 'none';
                parts.forEach(function (el) { el.style.animation = 'none'; });
                root.classList.remove('vt-pending');
                reveal();

                params.delete(KEY);
                const rest = params.toString();
                history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
            } else {
                // Занавес ставится в <head> по одному признаку — метке в
                // адресе. Если переезда всё-таки не будет (метка битая, гость
                // не выносит движения), убрать его обязано что-то другое,
                // иначе страница останется под ним навсегда.
                root.classList.remove('vt-veil', 'vt-shut');
            }

            // Записываем своё место: строка к этому моменту стоит там, где
            // будет стоять всегда, — соседний сайт метит именно сюда.
            if (document.readyState === 'loading') {
                window.addEventListener('DOMContentLoaded', function () { setTimeout(remember, 1200); });
            } else {
                setTimeout(remember, 1200);
            }
            window.addEventListener('resize', function () { setTimeout(remember, 300); });

            let primed = false;
            document.addEventListener('mouseover', function (e) {
                // Пока гость ведёт мышь к имени, визитка уже подгружается. Без
                // этого между документами будет пустой кадр, и строка не
                // переедет, а прыгнет.
                if (primed || !e.target.closest('.header-left')) return;
                primed = true;
                const tag = document.createElement('link');
                tag.rel = 'prefetch';
                tag.href = exit.href;
                document.head.appendChild(tag);
            });

            document.addEventListener('click', function (e) {
                // Клик с модификатором — это «открыть в новой вкладке»;
                // анимировать уход страницы, которая никуда не уходит, незачем.
                if (reduced || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
                if (!e.target.closest('.header-left')) return;
                e.preventDefault();

                const url = new URL(exit.href);
                // Поднимаем шапку над остальной страницей на время перелёта:
                // у листа резюме есть свой z-index, и строка уезжала под
                // превью и панель зума, вместо того чтобы идти поверх них.
                exit.style.position = 'relative';
                exit.style.zIndex = '30';
                // Отдельный слой: пока страница гасит превью и панель, главный
                // поток занят, и без этого строка дёргалась вместо движения.
                parts.forEach(function (el) { el.style.willChange = 'transform'; });
                // Метку прилёта не снимаем — она глушит родные появления, и
                // без неё браузер считает анимацию назначенной заново и
                // проигрывает её посреди отъезда. Правило ухода стоит в стилях
                // ниже правила прилёта, так что при равной длине побеждает оно.
                parts.forEach(function (el, i) {
                    const to = exitPoint(el, i);
                    // Симметрично визитке: анимация появления сильнее перехода
                    // и удержала бы строку на месте, попади клик в неё.
                    el.style.animation = 'none';
                    el.style.transition = 'transform 0.44s cubic-bezier(0.32, 0.72, 0, 1) 0.12s';
                    place(el, to);
                });
                root.classList.add('vt-leaving');
                // Занавес пока прозрачный: включать его в том же кадре, что и
                // сам класс, нельзя — переходу не от чего отсчитывать.
                root.classList.add('vt-veil');
                // Затемнение идёт внахлёст с концом полёта: строка ещё едет,
                // но фон уже сходится с тем, что покажет визитка. Полёт
                // кончается на 560 мс — занавес смыкается ровно к этому
                // моменту, ни раньше (иначе он съедает движение), ни позже.
                setTimeout(function () { root.classList.add('vt-shut'); }, 380);

                // Уходим, когда строка уже приехала, а занавес сошёлся: пишем
                // в адрес не то место, куда она метила, а то, где она
                // **фактически** оказалась. Раньше здесь стоял transitionend,
                // и уход приходился ровно на конец полёта — теперь ждём ещё и
                // занавес, иначе стык страниц опять виден.
                let gone = false;
                const go = function () {
                    if (gone) return;
                    gone = true;
                    let actual = [];
                    parts.forEach(function (el) { actual = actual.concat(textBox(el)); });
                    url.searchParams.set(KEY, actual.map(v => Math.round(v * 10) / 10).join(','));
                    location.href = url.toString();
                };
                setTimeout(go, 600);
            }, true);
        })();
        </script>

    <script>
        let currentLang = 'en';
        let currentZoom = 100;
        const ZOOM_STEP = 25;
        const ZOOM_MIN = 50;
        const ZOOM_MAX = 200;

        function updateZoomDisplay() {
            const container = document.getElementById('pdf-container');
            container.style.maxWidth = `${1000 * (currentZoom / 100)}px`;
            document.getElementById('zoom-label').textContent = `${currentZoom}%`;
            document.getElementById('zoom-in').disabled = currentZoom >= ZOOM_MAX;
            document.getElementById('zoom-out').disabled = currentZoom <= ZOOM_MIN;
        }

        // LANG:multi:start
        window.switchPdf = function (lang, el) {
            currentLang = lang;
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('download-btn').href = `CV-Timofey-Kondrashin-${lang}.pdf`;
            ['en', 'ru'].forEach(l => {
                document.getElementById(`pdf-pages-${l}`).style.display = l === lang ? '' : 'none';
            });
        };
        // LANG:multi:end

        window.zoomIn = function () {
            if (currentZoom < ZOOM_MAX) { currentZoom += ZOOM_STEP; updateZoomDisplay(); }
        };
        window.zoomOut = function () {
            if (currentZoom > ZOOM_MIN) { currentZoom -= ZOOM_STEP; updateZoomDisplay(); }
        };

        // Адрес под курсором — то же поведение, что на cosmdandy.dev.
        (function () {
            const hint = document.getElementById('link-hint');
            // Длинный хвост режем: адрес сертификата — сотня знаков с хэшем,
            // и подсказка растянулась бы во всю ширину окна. Читают в ней
            // всё равно хост и начало пути.
            const TAIL = 28;

            function show(href, x, y) {
                const m = /^(https?:\/\/|mailto:)(.*)$/.exec(href);
                const tail = m ? m[2] : href;
                const cut = tail.length > TAIL ? tail.slice(0, TAIL - 1) + '…' : tail;
                hint.innerHTML = m
                    ? '<span class="lh-scheme">' + m[1] + '</span>' + cut
                    : cut;
                hint.classList.add('on');
                // Держим плашку в пределах окна: у правого края и вверху страницы
                // она иначе уезжает за экран.
                const w = hint.offsetWidth, h = hint.offsetHeight;
                const left = Math.min(x + 18, window.innerWidth - w - 12);
                const top = Math.min(Math.max(y - h - 14, 10), window.innerHeight - h - 10);
                hint.style.transform = 'translate3d(' + left + 'px,' + top + 'px,0)';
            }

            function hide() {
                hint.classList.remove('on');
            }

            document.addEventListener('mousemove', function (e) {
                const a = e.target.closest('a[href]');
                // Кнопка скачивания ведёт на файл рядом, а не на чужой сайт:
                // подсказывать там нечего, да и плашка перекрыла бы саму кнопку.
                if (!a || a.classList.contains('btn-download')) return hide();
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#')) return hide();
                show(href, e.clientX, e.clientY);
            });

            document.addEventListener('mouseleave', hide);
            // На колесе и при смене языка ссылка под курсором уезжает, а
            // плашка осталась бы висеть с чужим адресом.
            window.addEventListener('scroll', hide, { passive: true });
        })();


        // Cursor glow follower
        const cursorGlow = document.getElementById('cursor-glow');
        const downloadBtn = document.querySelector('.btn-download');
        const dotsEl = document.querySelector('.dot-bg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0, hideGlow = false;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            if (!hideGlow) cursorGlow.classList.add('visible');
        });
        document.addEventListener('mouseleave', () => cursorGlow.classList.remove('visible'));
        downloadBtn.addEventListener('mouseenter', () => { hideGlow = true; cursorGlow.classList.remove('visible'); });
        downloadBtn.addEventListener('mouseleave', () => { hideGlow = false; cursorGlow.classList.add('visible'); });

        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Переключатель темы. Два состояния в интерфейсе, три по смыслу: пока
        // в localStorage пусто, страница следует за системой и реагирует на её
        // смену на лету.
        (function () {
            const btn = document.getElementById('theme-switch');
            const systemLight = window.matchMedia('(prefers-color-scheme: light)');
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function saved() {
                try {
                    const v = localStorage.getItem('theme');
                    return v === 'light' || v === 'dark' ? v : null;
                } catch (e) {
                    return null;
                }
            }

            function label(theme) {
                const text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                              : 'Светлая тема, включить тёмную';
                btn.setAttribute('aria-label', text);
                btn.setAttribute('title', text);
            }

            function setTheme(theme, animate) {
                const root = document.documentElement;
                if (animate && !reduced) {
                    root.classList.add('theme-animating');
                    window.setTimeout(function () { root.classList.remove('theme-animating'); }, 500);
                }
                root.setAttribute('data-theme', theme);
                label(theme);
            }

            // Пока светлая выключена, слушать некого и незачем: и кнопка, и
            // смена системной темы вели бы страницу туда, где её нет. Код
            // остаётся рабочим — включается вместе с THEME_CHOICE.
            if (THEME_CHOICE) {
                btn.addEventListener('click', function () {
                    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    try { localStorage.setItem('theme', next); } catch (e) {}
                    setTheme(next, true);
                });

                systemLight.addEventListener('change', function (e) {
                    if (!saved()) setTheme(e.matches ? 'light' : 'dark', true);
                });
            }

            label(document.documentElement.getAttribute('data-theme') || 'dark');
        })();
    </script>
    <script>
        // Отметка о сборке. Три стенда с виду неотличимы, и это регулярно
        // сбивало: правка проверена — но на каком именно стенде? Строку в углу
        // собираем из метки в шапке; кто её туда положил — дело пайплайна,
        // здесь она только читается.
        (function () {
            var raw = (document.querySelector('meta[name="build"]') || {}).content || '';
            var b = {};
            raw.split(';').forEach(function (p) {
                var i = p.indexOf('=');
                if (i > 0) b[p.slice(0, i)] = p.slice(i + 1);
            });
            // Продакшен тем и отличается, что на нём отметки нет: там её стирает
            // пайплайн выкатки. Пустая метка — нечего и рисовать.
            var where = { local: 'локально', cloudflare: 'cloudflare' }[b.env];
            if (!where) return;
            var head = [where];
            if (b.ref && b.ref !== '—') head.push(b.ref);
            if (b.pr) head.push('PR #' + b.pr);

            var el = document.createElement('div');
            el.className = 'build-badge';
            el.appendChild(document.createTextNode(head.join(' · ')));

            // Хэш ведёт на pull request, если он есть, и на коммит, если нет:
            // от «вижу поломку» до «вижу диф» одно нажатие. Плюс в конце хэша
            // значит несохранённое в дереве — на коммит с ним не сошлёшься.
            if (b.sha) {
                // Разделитель здесь, а не в конце шапки: без штампа хэша нет
                // вовсе, и точка повисала бы в воздухе — «локально · ».
                el.appendChild(document.createTextNode(' · '));
                var a = document.createElement('a');
                a.textContent = b.sha;
                a.href = 'https://github.com/' + (b.repo || 'CosmDandy/cv.cosmdandy.dev')
                    + (b.pr ? '/pull/' + b.pr : '/commit/' + b.sha.replace('+', ''));
                a.target = '_blank';
                a.rel = 'noopener';
                el.appendChild(a);
            }

            // Дату разворачиваем в часовом поясе смотрящего: она отвечает на
            // «насколько это свежее», а этот вопрос всегда про своё время.
            if (b.at) {
                var d = new Date(b.at);
                if (!isNaN(d)) {
                    var p2 = function (n) { return String(n).padStart(2, '0'); };
                    el.appendChild(document.createTextNode(' · '
                        + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear()
                        + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())));
                }
            }
            document.body.appendChild(el);
        })();
    </script>
</body>

</html>
