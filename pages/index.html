    <style>
        @font-face {

        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translate3d(0, 8px, 0); }
            to   { opacity: 1; transform: translate3d(0, 0, 0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: translate3d(0, 6px, 0) scale(0.96); }
            to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }

        @keyframes badgeShimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Цвета вынесены в переменные, чтобы светлая тема переопределяла их
           одним блоком ниже. По умолчанию — тёмная: она была тут всегда, и у
           тех, кто не выставил системную тему, страница остаётся прежней.

           Светлая — Solarized Light, та же гамма, что у cosmdandy.dev и блога.
           Свечение под превью в обеих темах одинаковое. */
        :root,
        :root[data-theme="dark"] {
            /* Длительность перекраски при смене темы — одна на весь файл,
               иначе фон, текст и рамки приезжают вразнобой. */
            --theme-fade: 0.45s cubic-bezier(0.32, 0.72, 0, 1);

            --fg: #ededed;
            --fg-muted: #839496;
            --fg-dim: #586e75;

            --bg: #000;
            --dots: rgba(147, 161, 161, 0.25);

            --surface-from:  rgba(255, 255, 255, 0.05);
            --surface-to:    rgba(255, 255, 255, 0.02);
            --surface-soft:  rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --surface-active: rgba(255, 255, 255, 0.08);

            --line:     rgba(255, 255, 255, 0.08);
            --line-top: rgba(255, 255, 255, 0.14);
            --img-line:     rgba(255, 255, 255, 0.10);
            --img-line-top: rgba(255, 255, 255, 0.20);
            --img-glow: rgba(255, 255, 255, 0.06);

            --cursor-glow-1: rgba(237, 237, 237, 0.035);
            --cursor-glow-2: rgba(237, 237, 237, 0.013);

            --btn-bg: var(--fg);
            --btn-fg: #000;

            --selection-fg: var(--fg);
            --focus: rgba(0, 220, 255, 0.5);

            /* Плашка переключателя контрастна фону: на тёмной теме светлая,
               на светлой тёмная — кнопка читается как отдельный предмет. */
            --inv-surface: rgba(238, 232, 213, 0.94);
            --inv-line:    rgba(88, 110, 117, 0.22);
            --inv-node:    #657b83;
            --inv-ray:     rgba(88, 110, 117, 0.38);
            --inv-shadow:  0 6px 20px -6px rgba(0, 0, 0, 0.85);
        }

        :root[data-theme="light"] {
            --fg: #073642;       /* base02 */
            --fg-muted: #657b83; /* base00 */
            --fg-dim: #93a1a1;   /* base1  */

            --bg: #fdf6e3;       /* base3  */
            --dots: rgba(88, 110, 117, 0.18);

            /* Поверхности на base2: та же логика «чуть плотнее фона», но со
               светлым основанием — иначе стекло превращается в грязь. */
            --surface-from:  rgba(238, 232, 213, 0.60);
            --surface-to:    rgba(238, 232, 213, 0.30);
            --surface-soft:  rgba(88, 110, 117, 0.05);
            --surface-hover: rgba(88, 110, 117, 0.08);
            --surface-active: rgba(88, 110, 117, 0.10);

            --line:     rgba(88, 110, 117, 0.14);
            --line-top: rgba(88, 110, 117, 0.20);
            --img-line:     rgba(88, 110, 117, 0.16);
            --img-line-top: rgba(88, 110, 117, 0.24);
            --img-glow: rgba(88, 110, 117, 0.18);

            --cursor-glow-1: rgba(7, 54, 66, 0.05);
            --cursor-glow-2: rgba(7, 54, 66, 0.018);

            --btn-bg: #073642;
            --btn-fg: #fdf6e3;

            --focus: rgba(38, 139, 210, 0.6);

            --inv-surface: rgba(7, 54, 66, 0.94);
            --inv-line:    rgba(147, 161, 161, 0.22);
            --inv-node:    #93a1a1;
            --inv-ray:     rgba(147, 161, 161, 0.40);
            --inv-shadow:  0 6px 20px -6px rgba(88, 110, 117, 0.35);
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme]) {
                --fg: #073642;       /* base02 */
                --fg-muted: #657b83; /* base00 */
                --fg-dim: #93a1a1;   /* base1  */

                --bg: #fdf6e3;       /* base3  */
                --dots: rgba(88, 110, 117, 0.18);

                /* Поверхности на base2: та же логика «чуть плотнее фона», но со
                   светлым основанием — иначе стекло превращается в грязь. */
                --surface-from:  rgba(238, 232, 213, 0.60);
                --surface-to:    rgba(238, 232, 213, 0.30);
                --surface-soft:  rgba(88, 110, 117, 0.05);
                --surface-hover: rgba(88, 110, 117, 0.08);
                --surface-active: rgba(88, 110, 117, 0.10);

                --line:     rgba(88, 110, 117, 0.14);
                --line-top: rgba(88, 110, 117, 0.20);
                --img-line:     rgba(88, 110, 117, 0.16);
                --img-line-top: rgba(88, 110, 117, 0.24);
                --img-glow: rgba(88, 110, 117, 0.18);

                --cursor-glow-1: rgba(7, 54, 66, 0.05);
                --cursor-glow-2: rgba(7, 54, 66, 0.018);

                --btn-bg: #073642;
                --btn-fg: #fdf6e3;

                --focus: rgba(38, 139, 210, 0.6);

                --inv-surface: rgba(7, 54, 66, 0.94);
                --inv-line:    rgba(147, 161, 161, 0.22);
                --inv-node:    #93a1a1;
                --inv-ray:     rgba(147, 161, 161, 0.40);
                --inv-shadow:  0 6px 20px -6px rgba(88, 110, 117, 0.35);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::selection {
            background: rgba(120, 40, 220, 0.4);
            color: var(--selection-fg);
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* Dot pattern background */
        .dot-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, var(--dots) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 1;
        }

        .page {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 16px 32px;
            width: 100%;
            max-width: 1000px;
        }

        .header-left {
            text-decoration: none;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: opacity 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 0ms backwards;
        }

        .header-left:hover {
            opacity: 0.7;
        }

        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 4px;
            color: var(--fg);
        }

        .header-left .subtitle {
            font-size: 0.9rem;
            color: var(--fg-dim);
            font-weight: 400;
        }

        .links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--fg-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .links a:hover {
            color: var(--fg);
        }

        .links a {
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .links a:nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 60ms backwards; }
        .links a:nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 120ms backwards; }
        .links a:nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 180ms backwards; }

        .links a svg {
            width: 16px;
            height: 16px;
        }

        /* Controls bar */
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            margin: 0 16px 24px;
            background: linear-gradient(180deg, var(--surface-from) 0%, var(--surface-to) 100%);
            border: 1px solid var(--line);
            border-top: 1px solid var(--line-top);
            border-radius: 14px;
            backdrop-filter: blur(25px);
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 240ms backwards;
        }

        .controls .btn,
        .controls .zoom-btn {
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 300ms backwards;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--fg-dim);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition:
                color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }

        .btn:hover {
            color: var(--fg);
            background: var(--surface-soft);
            transform: translate3d(0, -1px, 0);
        }

        .btn.active {
            background: var(--surface-active);
            border-color: var(--line);
            color: var(--fg);
        }

        .controls-divider {
            width: 1px;
            height: 20px;
            background: var(--line);
            margin: 0 4px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--fg-dim);
            font-size: 1.1rem;
            cursor: pointer;
            transition:
                color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .zoom-btn:hover:not(:disabled) {
            color: var(--fg);
            background: var(--surface-hover);
            transform: translate3d(0, -1px, 0);
        }

        .zoom-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .zoom-label {
            font-size: 0.75rem;
            color: var(--fg-dim);
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .btn-download {
            position: relative;
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
            isolation: isolate;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 360ms backwards;
            transition:
                transform 0.44s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-download::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg,
                    rgba(255, 50, 100, 0)    0%,
                    rgba(255, 50, 100, 0.35) 20%,
                    rgba(120, 40, 220, 0.35) 50%,
                    rgba(0, 220, 255, 0.35)  80%,
                    rgba(0, 220, 255, 0)     100%);
            background-size: 200% 100%;
            background-position: 200% 0;
            mix-blend-mode: multiply;
            animation: badgeShimmer 4.5s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        .btn-download:hover {
            transform: translate3d(0, -1px, 0) scale(1.02);
            filter: brightness(1.05);
        }


        /* ── Переключатель темы ───────────────────────────────────────────
           Два состояния, солнце и луна. Отдельного «авто» в интерфейсе нет:
           пустой localStorage сам означает «следуй за системой», а первый
           клик записывает явный выбор.

           Живёт в панели управления: угол экрана занят ссылками шапки. */
        .theme-switch {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid var(--inv-line);
            background: var(--inv-surface);
            box-shadow: var(--inv-shadow);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: popIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) 330ms backwards;
            transition:
                background   var(--theme-fade),
                border-color var(--theme-fade),
                box-shadow   var(--theme-fade),
                transform    0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-switch:hover { transform: translate3d(0, -1px, 0); }
        .theme-switch:active { transform: translate3d(0, 0, 0) scale(0.96); }

        /* Иконки лежат друг на друге: одна уезжает, вторая приезжает. */
        .theme-switch svg {
            grid-area: 1 / 1;
            width: 18px;
            height: 18px;
            display: block;
            color: var(--inv-node);
            transition:
                opacity   0.35s ease,
                transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
                color     var(--theme-fade);
        }

        .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0.5); }
        .icon-moon { opacity: 0; transform: rotate(90deg)  scale(0.5); }

        :root[data-theme="light"] .icon-sun,
        :root:not([data-theme]) .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }

        :root[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        :root[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) .icon-sun { opacity: 0; transform: rotate(-90deg) scale(0.5); }
            :root:not([data-theme]) .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .theme-switch { animation: none; }
        }

        /* ── Плавная смена темы ───────────────────────────────────────────
           Переходы навешиваются только на время переключения: постоянные
           перебили бы собственные анимации панели и подсветку кнопок. */
        :root.theme-animating,
        :root.theme-animating *,
        :root.theme-animating *::before,
        :root.theme-animating *::after {
            transition:
                background-color var(--theme-fade),
                background-image var(--theme-fade),
                color            var(--theme-fade),
                border-color     var(--theme-fade),
                box-shadow       var(--theme-fade),
                fill             var(--theme-fade),
                stroke           var(--theme-fade) !important;
        }

        /* PDF Viewer */
        .viewer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px 48px;
        }

        #pdf-container {
            position: relative;
            max-width: 1000px;
            width: 100%;
            transition: max-width 0.18s linear;
            animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) 420ms backwards;
        }

        /* Glow effect — sits behind PDF, follows container size */
        .glow {
            position: absolute;
            inset: -120px;
            border-radius: 60px;
            background: linear-gradient(45deg,
                    rgba(255, 50, 100, 0.45) 0%,
                    rgba(255, 80, 150, 0.30) 25%,
                    rgba(120, 40, 220, 0.15) 50%,
                    rgba(0, 220, 255, 0.30) 75%,
                    rgba(0, 255, 255, 0.45) 100%);
            filter: blur(160px);
            pointer-events: none;
            z-index: 0;
            animation: none;
        }

        #pdf-container img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            border: 1px solid var(--img-line);
            border-top: 1px solid var(--img-line-top);
            box-shadow:
                0 0 0 1px var(--surface-soft),
                0 0 80px -20px var(--img-glow);
            margin-bottom: 16px;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 32px 16px;
            color: var(--fg-dim);
            font-size: 0.8rem;
            transform: translateZ(0);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            animation: fadeUp 0.65s cubic-bezier(0.32, 0.72, 0, 1) 720ms backwards;
        }

        .footer a {
            color: var(--fg-dim);
            text-decoration: none;
            transition: color 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .footer a:hover {
            color: var(--fg-muted);
        }

        /* Loading — reserve space matching A4 aspect ratio */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 210 / 297;
            width: 100%;
            color: var(--fg-dim);
            font-size: 0.9rem;
        }

        /* Cursor follower — subtle white spotlight */
        .cursor-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                    var(--cursor-glow-1) 0%,
                    var(--cursor-glow-2) 35%,
                    transparent 60%);
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: opacity 0.40s cubic-bezier(0.32, 0.72, 0, 1);
            opacity: 0;
            will-change: transform, opacity;
        }

        .cursor-glow.visible {
            opacity: 1;
        }

        /* Mobile */
        @media (max-width: 640px) {

            html,
            body {
                overflow-x: hidden;
                max-width: 100vw;
            }

            .header {
                padding: 24px 16px 16px;
            }

            .header-left h1 {
                font-size: 1.1rem;
            }

            .header-left .subtitle {
                font-size: 0.8rem;
            }

            .links {
                gap: 12px;
            }

            .links a span {
                display: none;
            }

            .links a svg {
                width: 22px;
                height: 22px;
            }

            .links a {
                gap: 0;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .zoom-controls {
                display: none;
            }

            .controls-divider {
                display: none;
            }

            .viewer {
                padding: 0 16px 8px;
            }

            .footer {
                padding: 12px 16px;
            }

            #pdf-container {
                max-width: 100% !important;
            }

            #pdf-container img {
                border-radius: 10px;
                margin-bottom: 8px;
            }

            .glow {
                inset: -40px;
                filter: blur(60px);
            }

            .cursor-glow {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
            .btn-download::before { display: none; }
            .cursor-glow         { display: none; }
        }
    </style>
</head>

<body>

    <div class="dot-bg"></div>

    <div class="page">

                            d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"
                            fill="currentColor" />

                    <svg viewBox="0 0 24 24" fill="none">

                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.06-.49-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.74 3.99-1.74 6.65-2.89 7.99-3.44 3.8-1.58 4.59-1.86 5.1-1.87.11 0 .37.03.54.17.14.12.18.28.2.45-.01.06.01.24 0 .38z"

        <div class="controls">

            <!-- LANG:multi:end -->
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="window.zoomOut()" id="zoom-out">−</button>
                <span class="zoom-label" id="zoom-label">100%</span>

                    aria-label="Сменить тему" title="Сменить тему">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" aria-hidden="true">

    <script>
        let currentLang = 'en';
        let currentZoom = 100;
        const ZOOM_STEP = 25;
        const ZOOM_MIN = 50;
        const ZOOM_MAX = 200;

        function updateZoomDisplay() {
            const container = document.getElementById('pdf-container');
            container.style.maxWidth = `${1000 * (currentZoom / 100)}px`;
            document.getElementById('zoom-label').textContent = `${currentZoom}%`;
            document.getElementById('zoom-in').disabled = currentZoom >= ZOOM_MAX;
            document.getElementById('zoom-out').disabled = currentZoom <= ZOOM_MIN;
        }

        // LANG:multi:start
        window.switchPdf = function (lang, el) {
            currentLang = lang;
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('download-btn').href = `CV-Timofey-Kondrashin-${lang}.pdf`;
            ['en', 'ru'].forEach(l => {
                document.getElementById(`pdf-pages-${l}`).style.display = l === lang ? '' : 'none';
            });
        };
        // LANG:multi:end

        window.zoomIn = function () {
            if (currentZoom < ZOOM_MAX) { currentZoom += ZOOM_STEP; updateZoomDisplay(); }
        };
        window.zoomOut = function () {
            if (currentZoom > ZOOM_MIN) { currentZoom -= ZOOM_STEP; updateZoomDisplay(); }
        };

        // Cursor glow follower
        const cursorGlow = document.getElementById('cursor-glow');
        const downloadBtn = document.querySelector('.btn-download');
        const dotsEl = document.querySelector('.dot-bg');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0, hideGlow = false;
        let dotsX = 0, dotsY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            if (!hideGlow) cursorGlow.classList.add('visible');
        });
        document.addEventListener('mouseleave', () => cursorGlow.classList.remove('visible'));
        downloadBtn.addEventListener('mouseenter', () => { hideGlow = true; cursorGlow.classList.remove('visible'); });
        downloadBtn.addEventListener('mouseleave', () => { hideGlow = false; cursorGlow.classList.add('visible'); });

        function animateCursor() {
            glowX += (mouseX - glowX) * 0.15;
            glowY += (mouseY - glowY) * 0.15;
            cursorGlow.style.left = glowX + 'px';
            cursorGlow.style.top = glowY + 'px';

            if (!prefersReducedMotion) {
                const targetDotsX = (mouseX / window.innerWidth - 0.5) * 10;
                const targetDotsY = (mouseY / window.innerHeight - 0.5) * 10;
                dotsX += (targetDotsX - dotsX) * 0.05;
                dotsY += (targetDotsY - dotsY) * 0.05;
                dotsEl.style.backgroundPosition = `${dotsX.toFixed(2)}px ${dotsY.toFixed(2)}px`;
            }

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Переключатель темы. Два состояния в интерфейсе, три по смыслу: пока
        // в localStorage пусто, страница следует за системой и реагирует на её
        // смену на лету.
        (function () {
            const btn = document.getElementById('theme-switch');
            const systemLight = window.matchMedia('(prefers-color-scheme: light)');
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function saved() {
                try {
                    const v = localStorage.getItem('theme');
                    return v === 'light' || v === 'dark' ? v : null;
                } catch (e) {
                    return null;
                }
            }

            function label(theme) {
                const text = theme === 'dark' ? 'Тёмная тема, включить светлую'
                                              : 'Светлая тема, включить тёмную';
                btn.setAttribute('aria-label', text);
                btn.setAttribute('title', text);
            }

            function setTheme(theme, animate) {
                const root = document.documentElement;
                if (animate && !reduced) {
                    root.classList.add('theme-animating');
                    window.setTimeout(function () { root.classList.remove('theme-animating'); }, 500);
                }
                root.setAttribute('data-theme', theme);
                label(theme);
            }

            btn.addEventListener('click', function () {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('theme', next); } catch (e) {}
                setTheme(next, true);
            });

            systemLight.addEventListener('change', function (e) {
                if (!saved()) setTheme(e.matches ? 'light' : 'dark', true);
            });

            label(document.documentElement.getAttribute('data-theme') || 'dark');
        })();
    </script>
